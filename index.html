<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="J.A.R.V.I.S">
  <title>J.A.R.V.I.S — Training</title>

  <!-- Inline SVG icon (no image files). Arc-reactor mark. iOS standalone is
       driven by the apple-mobile-web-app-* meta tags above, not by a manifest. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070C18'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%2338E1FF' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%2338E1FF'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070C18'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%2338E1FF' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%2338E1FF'/%3E%3C/svg%3E">

  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <!-- HOME -->
    <section class="view active" id="view-home">
      <div class="topbar"><h1>Training</h1></div>
    </section>

    <!-- LIVE WORKOUT -->
    <section class="view" id="view-live"></section>

    <!-- EXERCISES -->
    <section class="view" id="view-exercises">
      <div class="topbar"><h1>Übungen</h1></div>
    </section>

    <!-- HISTORY -->
    <section class="view" id="view-history">
      <div class="topbar"><h1>Verlauf</h1></div>
    </section>

    <!-- STATS -->
    <section class="view" id="view-stats">
      <div class="topbar"><h1>Statistik</h1></div>
    </section>
  </div>

  <!-- Rest timer strip -->
  <div class="rest-strip" id="restStrip">
    <div><div class="muted tiny">Pause</div><div class="t num" id="restT">2:00</div></div>
    <div class="row" style="gap:8px">
      <button class="btn ghost" style="min-height:44px;padding:0 14px" id="restAdd">+15s</button>
      <button class="btn ghost" style="min-height:44px;padding:0 14px" id="restSkip">Skip</button>
    </div>
  </div>

  <!-- Tab bar -->
  <nav class="tabbar">
    <button data-view="home" class="active">
      <svg class="ic" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Home</button>
    <button data-view="exercises">
      <svg class="ic" viewBox="0 0 24 24"><path d="M4 8v8M20 8v8M8 6v12M16 6v12"/><path d="M8 12h8"/></svg>Übungen</button>
    <button data-view="history">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Verlauf</button>
    <button data-view="stats">
      <svg class="ic" viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 16v-4M13 16V9M18 16v-7"/></svg>Statistik</button>
  </nav>

  <!-- Sheet -->
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet"></div>

  <div id="toast"></div>

  <script src="./app.js"></script>
</body>
</html>
