<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#04120C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MYO">
  <title>MYO</title>

  <!-- Inline SVG icon (no image files). Reactor mark, green. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23071A12'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%2334E29B' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%2334E29B'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23071A12'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%2334E29B' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%2334E29B'/%3E%3C/svg%3E">

  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- Boot sequence -->
  <div id="boot">
    <div class="boot-reactor"><span></span></div>
    <div class="boot-brand">MYO</div>
    <div class="boot-title">SYSTEM ONLINE</div>
    <div class="boot-sub">Willkommen zurück, <span class="boot-name">Sam</span></div>
  </div>

  <div id="app">
    <section class="view active" id="view-home"></section>
    <section class="view" id="view-training"></section>
    <section class="view" id="view-exercises"></section>
    <section class="view" id="view-progress"></section>
    <section class="view" id="view-profile"></section>
  </div>

  <!-- Rest timer (reactor ring) — filled by JS -->
  <div class="rest-strip" id="restStrip"></div>

  <!-- Tab bar -->
  <nav class="tabbar">
    <button data-view="home" class="active">
      <svg class="ic" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Home</button>
    <button data-view="training">
      <svg class="ic" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11"/><path d="M3 8l2-2 3 3-2 2z"/><path d="M21 16l-2 2-3-3 2-2z"/><path d="M16 3l2 2-2 2-2-2z"/><path d="M8 21l-2-2 2-2 2 2z"/></svg>Training</button>
    <button data-view="exercises">
      <svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Übung</button>
    <button data-view="progress">
      <svg class="ic" viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 15l3-4 3 2 4-6"/></svg>Progress</button>
    <button data-view="profile">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profil</button>
  </nav>

  <!-- Sheet + scrim -->
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet"></div>

  <!-- PR moment -->
  <div id="prOverlay"></div>

  <div id="toast"></div>

  <script src="./app.js"></script>
</body>
</html>
